name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: protocite
          POSTGRES_PASSWORD: protocite-password
          POSTGRES_DB: protocite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tesseract & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-hin

      - name: Install Python dependencies
        run: |
          cd backend
          uv sync --dev

      - name: Lint with Ruff
        run: |
          cd backend
          uv run ruff check .
          uv run ruff format --check .

      - name: Run Backend Unit Tests
        env:
          APP_ENV: test
          SECRET_KEY: ci-test-secret-key-32-characters-minimum
          DATABASE_URL: postgresql+asyncpg://protocite:protocite-password@localhost:5432/protocite_test
          REDIS_URL: redis://localhost:6379/0
          INGEST_INLINE: "true"
        run: |
          cd backend
          uv run pytest tests/unit

  frontend-test:
    name: Frontend Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Check formatting with Prettier
        run: |
          cd frontend
          npm run format:check

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Typecheck TypeScript
        run: |
          cd frontend
          npm run typecheck

      - name: Run Vitest unit tests
        run: |
          cd frontend
          npm test
