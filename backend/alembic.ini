[alembic]
script_location = %(here)s/app/db/migrations
prepend_sys_path = .
path_separator = os
# DATABASE_URL from the environment / .env is used (see env.py); this is only a fallback.
sqlalchemy.url = postgresql+asyncpg://protocite:protocite@localhost:5432/protocite

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
